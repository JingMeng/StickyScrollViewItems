apply plugin: 'com.android.library'

android {
    namespace 'com.emilsjolander.components.StickyScrollViewItems'
    compileSdk 34

    defaultConfig {
        minSdkVersion 7
        targetSdkVersion 34
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

