apply plugin: 'com.android.application'

dependencies {
    implementation project(':library')
    implementation 'com.android.support:support-v4:18.0.0'
}

android {
    namespace 'com.emilsjolander.components.StickyScrollViewItems.samples'
    compileSdk 34

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 34
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

